[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# QIE EVM (checked 25 Oct 2026): PUSH0 works, MCOPY/TSTORE (Cancun) are "opcode not defined".
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/vectors" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
qie_testnet = "https://rpc2testnet.qie.digital/"
qie_mainnet = "https://rpc1mainnet.qie.digital"

# Blockscout explorers (etherscan-compatible API). Blockscout needs no API key; forge wants a value.
# Checked 26 Oct 2026: the mainnet verifier lists solc 0.8.28; the testnet one lists no compilers.
[etherscan]
qie_mainnet = { key = "blockscout", url = "https://mainnet.qie.digital/api/", chain = 1990 }
qie_testnet = { key = "blockscout", url = "https://testnet.qie.digital/api/", chain = 1983 }

[fmt]
line_length = 120
